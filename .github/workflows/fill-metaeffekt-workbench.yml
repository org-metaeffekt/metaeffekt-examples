name: Fill metaeffekt-workbench Example

on:
  workflow_dispatch:

jobs:
  fill-metaeffekt-workbench-example:
    name: Fill metaeffekt-workbench Example
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Resolve Inventory
        uses: org-metaeffekt/metaeffekt-components/resolve@0.1.0
        with:
          input-path: './examples/software/metaeffekt-workbench/01-analyzed/metaeffekt-workbench.xlsx'
          output-path: './examples/software/metaeffekt-workbench/02-resolved/metaeffekt-workbench-resolved.xlsx'
          cache-dependencies: 'true'

      - name: Push Changes
        shell: bash
        run: |
          git config --local user.name "ae-actions-runner"
          git config --local user.email "ae-actions-runner@metaeffekt.com"
          git fetch origin experimental
          git pull origin experimental --rebase || true
          git add .
          if [[ -n $(git status --porcelain) ]]; then
            git commit -m "Automated commit from actions runner"
            git push origin experimental || (git pull --rebase origin experimental && git push origin experimental)
          fi